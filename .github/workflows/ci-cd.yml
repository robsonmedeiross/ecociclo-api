
name: EcoCiclo - CI/CD

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore EcoCicloSolution.slnx

      - name: Compilar solucao
        run: dotnet build EcoCicloSolution.slnx -c Release --no-restore

      - name: Executar testes unitarios
        run: dotnet test EcoCiclo.Tests/EcoCiclo.Tests.csproj -c Release --no-build

  docker-build:
    name: Build Docker
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EcoCiclo.API/Dockerfile
          push: false
          tags: ecociclo-api:teste

  deploy-staging:
    name: Deploy Staging
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EcoCiclo.API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecociclo-api:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/ecociclo-api:staging-${{ github.sha }}

  deploy-production:
    name: Deploy Production
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EcoCiclo.API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecociclo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecociclo-api:prod-${{ github.sha }}
