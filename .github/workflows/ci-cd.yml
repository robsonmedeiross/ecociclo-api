
name: EcoCiclo - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore EcoCicloSolution.slnx

      - name: Compilar projeto
        run: dotnet build EcoCicloSolution.slnx -c Release --no-restore

      - name: Executar testes unitarios
        run: dotnet test EcoCiclo.Tests/EcoCiclo.Tests.csproj -c Release --no-build

  docker-build:
    name: Validar Build Docker
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EcoCiclo.API/Dockerfile
          push: false
          tags: ecociclo-api:teste

  docker-push:
    name: Publicar no Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EcoCiclo.API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecociclo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ecociclo-api:${{ github.sha }}
